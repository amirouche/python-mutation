name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: lint
        run: uv run ruff check

      - name: check-fail-fast
        run: make check-fail-fast

      - name: check-with-coverage
        run: make check-with-coverage

      - name: check-survivors
        run: make check-survivors
        continue-on-error: true
